# nginx site for aware-server: TLS termination in front of the gunicorn socket.
# Rendered by scripts/lib.sh (install_nginx); @...@ placeholders are filled in there.

# Per-client rate limit. Sized for one phone posting every table back to back
# on a sync; participants behind carrier NAT can share an address.
limit_req_zone $binary_remote_addr zone=aware:10m rate=10r/s;

server {
    listen 80;
    server_name @DOMAIN@;
    more_clear_headers Server;
    more_set_headers "X-Content-Type-Options: nosniff";
    # Same method allow-list as the 443 block; must precede the redirect,
    # otherwise nginx returns 301 before evaluating it.
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    # Let's Encrypt HTTP-01 challenges, answered from certbot's webroot. The
    # redirect lives in its own location so it does not catch these too.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name @DOMAIN@;
    ssl_certificate @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    # Pinned here rather than inherited from the distribution default.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    # OCSP stapling, verified against the issuing chain. Takes effect when the
    # certificate carries an OCSP responder URL; otherwise nginx notes it and skips.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate @SSL_CHAIN@;
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;
    more_clear_headers Server;
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    more_set_headers "Cross-Origin-Resource-Policy: same-origin";
    server_tokens off;
    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }
    # Study URLs (config fetches and uploads) carry the participant label in
    # the request line, so they are not access-logged.
    location ~ "^/v[0-9]+/[^/]+/" {
        access_log off;
        limit_req zone=aware burst=50 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/aware/aware-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    location / {
        limit_req zone=aware burst=50 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/aware/aware-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
}
